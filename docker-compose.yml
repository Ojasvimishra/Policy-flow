version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policyflow-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=policyflow
      - DB_USERNAME=policyflow_user
      - DB_PASSWORD=secret_local_password
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - policyflow-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policyflow-queue-worker
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=policyflow
      - DB_USERNAME=policyflow_user
      - DB_PASSWORD=secret_local_password
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - policyflow-network

  db:
    image: postgres:16-alpine
    container_name: policyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: policyflow
      POSTGRES_USER: policyflow_user
      POSTGRES_PASSWORD: secret_local_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyflow_user -d policyflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - policyflow-network

  redis:
    image: redis:7-alpine
    container_name: policyflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - policyflow-network

  frontend:
    image: node:22-alpine
    container_name: policyflow-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    command: ["sh", "-c", "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else echo 'Frontend not yet initialized' && sleep 3600; fi"]
    networks:
      - policyflow-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  policyflow-network:
    driver: bridge
